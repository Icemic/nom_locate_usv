[package]
authors = [
  "Florent FAYOLLE <florent.fayolle69@gmail.com>",
  "Christopher Durham <cad97@cad97.com>",
  "Valentin Lorentz <progval+git@progval.net>",
  "Icemic <bingfeng.web@gmail.com>"
]
categories = ["parsing"]
description = "A special input type for nom to locate tokens"
documentation = "https://docs.rs/nom_locate_usv/"
edition = "2018"
homepage = "https://github.com/Icemic/nom_locate_usv"
keywords = ["nom"]
license = "MIT"
name = "nom_locate_usv"
readme = "README.md"
repository = "https://github.com/Icemic/nom_locate_usv"
rust-version = "1.65.0"
version = "5.0.0"

[badges.travis-ci]
repository = "Icemic/nom_locate_usv"

[features]
alloc = ["nom/alloc"]
default = ["std"]
generic-simd = ["bytecount/generic-simd"]
runtime-dispatch-simd = ["bytecount/runtime-dispatch-simd"]
stable-deref-trait = ["stable_deref_trait"]
std = ["nom/std", "alloc", "memchr/use_std"]

[dependencies]
bytecount = "^0.6"
memchr = {version = ">=1.0.1, <3.0.0", default-features = false}                 # ^1.0.0 + ^2.0
nom = {version = "8", default-features = false}
stable_deref_trait = {version = "^1", optional = true, default-features = false}
